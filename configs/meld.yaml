name: meld_api_traces
description: MELD API trace and sandbox analysis (capability extraction, MITRE mapping, behavior explanation)
loader: data.meld_loader.load_meld
task: tasks.meld_task.meld_task
scorers:
  # mitre_mapping tasks — accuracy with MITRE normalization
  - scorers.accuracy_scorer.AccuracyScorer
  # capability_extraction tasks — macro F1 (multi-label)
  - scorers.malware_scorer.MalwareBehaviorScorer
  # behavior_explanation tasks — LLM judge rubric (0-3, normalized to [0,1])
  - scorers.llm_judge_scorer.LLMJudgeScorer
  # cross-cutting quality metrics
  - scorers.explanation_similarity_scorer.ExplanationSimilarityScorer
  - scorers.hallucination_scorer.HallucinationScorer
